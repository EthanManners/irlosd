[package]
name = "irlosd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "IRLOS seat daemon: supervises headless IrlosStudio and controls it over ICP"

[dependencies]
crossterm = "0.29.0"
libc = "0.2.191"
serde_json = "1.0.154"
signal-hook = "0.4.6"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[profile.release]
strip = true
